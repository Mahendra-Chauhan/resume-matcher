{% extends "base.html" %}
{% block content %}
    <h1>Step 1: Upload Resumes</h1>

    <form method="POST" action="/upload" enctype="multipart/form-data">
        <input type="file" name="resumes" accept=".pdf" multiple required>
        <button type="submit">Upload</button>
    </form>

    {% if messages %}
        <h2>Results:</h2>
        <ul>
        {% for msg in messages %}
            <li>{{ msg }}</li>
        {% endfor %}
        </ul>
        <p><a href="/jd">Next: Add a Job Description →</a></p>
    {% endif %}
{% endblock %}
